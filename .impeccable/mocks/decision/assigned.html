<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Rótulo pintado</title>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Yellowtail&family=Archivo:wght@500;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#ee7a2f;font-family:Archivo,sans-serif;color:#1b2236;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px);background-size:100% 72px,120px 100%}
nav{position:absolute;top:0;left:0;right:0;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;border-bottom:3px solid #1b2236}
nav b{font-family:'Bowlby One';font-size:26px}nav span{font-weight:800;font-size:15px;margin-left:28px}
.script{position:absolute;left:48px;top:110px;font-family:Yellowtail;font-size:64px;color:#fff;text-shadow:4px 4px 0 #1b2236}
h1{position:absolute;left:48px;top:190px;width:900px;font-family:'Bowlby One';font-size:104px;line-height:.92;text-transform:uppercase;color:#1b2236;text-shadow:6px 6px 0 #fff}
.board{position:absolute;right:48px;top:118px;width:420px;background:#1b2236;color:#fff;padding:28px 30px;border:6px solid #fff;outline:3px solid #1b2236}
.board h2{font-family:Yellowtail;font-size:44px;color:#ee7a2f}
.row{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px dashed rgba(255,255,255,.4);padding:16px 0}
.row b{font-family:'Bowlby One';font-size:26px}.row em{font-style:normal;font-family:'Bowlby One';font-size:34px;color:#ee7a2f}
.cta{position:absolute;left:48px;bottom:72px;display:flex;gap:20px}
.cta a{display:inline-block;background:#1b2236;color:#fff;font-family:'Bowlby One';font-size:28px;padding:22px 36px;text-decoration:none;box-shadow:6px 6px 0 #fff}
.cta a+a{background:#fff;color:#1b2236;box-shadow:6px 6px 0 #1b2236}
</style></head><body><div class="grid"></div>
<nav><b>CEHACIS</b><div><span>Cursos</span><span>Programas</span><span>Nosotros</span><span>Contacto</span></div></nav>
<p class="script">¡Se entrena aquí!</p>
<h1>Transformamos tu voz, tu presencia y tu capacidad de conectar</h1>
<div class="board"><h2>Cursos del mes</h2>
<div class="row"><b>Oratoria</b><em>$39</em></div><div class="row"><b>Comunicación asertiva</b><em>$29</em></div><div class="row"><b>Resolución de conflictos</b><em>$39</em></div></div>
<div class="cta"><a href="#">Inscribirme</a><a href="#">Ver los cursos</a></div>
</body></html>
