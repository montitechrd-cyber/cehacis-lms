<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>CEHACIS · Fachada iluminada</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b2236;--orange:#ee7a2f;--paper:#ffffff;--stone:#f2f2f0;--graphite:#4a4a4d}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--ink)}
body{position:relative;width:1440px;height:900px;overflow:hidden;background:var(--ink);color:var(--paper);font-family:"Schibsted Grotesk",sans-serif}
header{position:absolute;left:0;top:0;width:1440px;height:64px;background:var(--ink);border-bottom:1px solid rgba(255,255,255,.15);display:flex;align-items:center;padding:0 48px;z-index:3}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px;letter-spacing:.08em;color:var(--paper);text-decoration:none}
nav{display:flex;gap:36px;margin-left:72px}
nav a,.login{color:rgba(255,255,255,.75);text-decoration:none;font-size:15px;font-weight:600}
.right{margin-left:auto;display:flex;align-items:center;gap:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;font:700 16px "Schibsted Grotesk",sans-serif;text-decoration:none;border-radius:2px;height:52px;padding:0 30px}
.btn.sm{height:38px;padding:0 20px;font-size:14px}
.pri{background:var(--orange);color:var(--ink)}
.out{border:1px solid var(--paper);color:var(--paper)}
.waves{position:absolute;left:0;top:104px}
.temple{position:absolute;left:460px;top:72px;width:520px;height:485px;z-index:2}
h1{position:absolute;left:0;top:574px;width:1440px;text-align:center;font-weight:800;font-size:58px;line-height:1.05;letter-spacing:-.035em;color:var(--paper)}
h1 .sw{position:relative;display:inline-block}
h1 .sw svg{position:absolute;left:-2%;bottom:-16px;width:104%;height:18px}
.cta{position:absolute;left:0;top:724px;width:1440px;display:flex;justify-content:center;gap:16px}
footer{position:absolute;left:0;bottom:0;width:1440px;height:56px;border-top:1px solid rgba(255,255,255,.15);display:flex;justify-content:center;align-items:center;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6)}
footer span{padding:0 36px;border-left:1px solid rgba(255,255,255,.2);line-height:18px}
footer span:first-child{border-left:0}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
 <symbol id="t" viewBox="0 0 120 112">
  <g fill="#ee7a2f">
   <path d="M60 6 L110 32 H10 Z"/>
   <rect x="16" y="35" width="88" height="7"/><rect x="22" y="44" width="76" height="3"/>
   <rect x="27" y="50" width="12" height="36"/><rect x="45" y="50" width="12" height="36"/><rect x="63" y="50" width="12" height="36"/><rect x="81" y="50" width="12" height="36"/>
   <rect x="20" y="89" width="80" height="5"/><rect x="13" y="96" width="94" height="5"/><rect x="6" y="103" width="108" height="6"/>
  </g>
  <g fill="#1b2236">
   <path d="M60 21 C57 15.5 52.500 16.500 54 20.500 C55 23 58 22 60 21 Z"/><path d="M60 21 C63 15.500 67.500 16.500 66 20.500 C65 23 62 22 60 21 Z"/>
   <path d="M60 21.500 C57.500 22.500 55.500 25 57.500 25.800 C59.500 26.300 60 23.500 60 21.500 Z"/><path d="M60 21.500 C62.500 22.500 64.500 25 62.500 25.800 C60.500 26.300 60 23.500 60 21.500 Z"/>
   <g id="vb"><rect x="51.400" y="24.500" width="1.250" height="3" rx=".6"/><rect x="47.550" y="23" width="1.250" height="6" rx=".6"/><rect x="43.700" y="21" width="1.250" height="10" rx=".6"/><rect x="39.850" y="23" width="1.250" height="6" rx=".6"/><rect x="36" y="20" width="1.250" height="12" rx=".6"/><rect x="32.150" y="22" width="1.250" height="8" rx=".6"/></g>
   <use href="#vb" transform="translate(120 0) scale(-1 1)"/>
  </g>
 </symbol>
 <pattern id="p" width="120" height="80" patternUnits="userSpaceOnUse">
  <g fill="#ee7a2f"><rect x="10" y="34" width="4" height="12" rx="2"/><rect x="34" y="21" width="4" height="38" rx="2"/><rect x="58" y="5" width="4" height="70" rx="2"/><rect x="82" y="27" width="4" height="26" rx="2"/><rect x="106" y="14" width="4" height="52" rx="2"/></g>
 </pattern>
</defs></svg>

<header>
 <a class="brand" href="#"><svg width="36" height="34" viewBox="0 0 120 112"><use href="#t"/></svg>CEHACIS</a>
 <nav><a href="#">Cursos</a><a href="#">Programas</a><a href="#">Facilitadores</a><a href="#">Nosotros</a><a href="#">Contacto</a></nav>
 <div class="right"><a class="login" href="#">Iniciar sesión</a><a class="btn sm pri" href="#">Crear cuenta</a></div>
</header>

<svg class="waves" width="1440" height="160" viewBox="0 0 1440 160">
 <g fill="url(#p)">
  <rect x="0" y="40" width="135" height="80" opacity=".1"/><rect x="135" y="40" width="135" height="80" opacity=".22"/><rect x="270" y="40" width="135" height="80" opacity=".4"/><rect x="405" y="40" width="135" height="80" opacity=".65"/>
  <rect x="900" y="40" width="135" height="80" opacity=".65"/><rect x="1035" y="40" width="135" height="80" opacity=".4"/><rect x="1170" y="40" width="135" height="80" opacity=".22"/><rect x="1305" y="40" width="135" height="80" opacity=".1"/>
 </g>
</svg>

<svg class="temple" viewBox="0 0 120 112" role="img" aria-label="Templo CEHACIS">
 <use href="#t"/>
 <text x="60" y="40.400" text-anchor="middle" textLength="82" lengthAdjust="spacingAndGlyphs" font-family="Schibsted Grotesk" font-weight="700" font-size="2.300" fill="#1b2236">N.º 01 Oratoria · N.º 02 Comunicación Asertiva · N.º 03 Resolución de Conflictos</text>
</svg>

<h1>Transformamos tu voz, tu presencia<br>y tu capacidad de <span class="sw">conectar.<svg viewBox="0 0 220 18" preserveAspectRatio="none"><path d="M3 12 C40 3 90 15 130 8 S195 4 217 9" fill="none" stroke="#ee7a2f" stroke-width="4.500" stroke-linecap="round"/></svg></span></h1>

<div class="cta"><a class="btn pri" href="#">Ver cursos →</a><a class="btn out" href="#">Crear cuenta</a></div>

<footer><span>Online</span><span>Certificado verificable</span><span>Prácticas con rúbrica</span></footer>
</body></html>
